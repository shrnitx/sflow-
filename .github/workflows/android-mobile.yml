name: StudyFlow Android App

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/android-mobile.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/android-mobile.yml"

permissions:
  contents: read

concurrency:
  group: android-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    name: Build and verify Android debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "true"
      REACT_APP_SUPABASE_URL: https://example.supabase.co
      REACT_APP_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_only_dummy_value
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install frontend dependencies
        run: npm ci

      - name: Install pinned Capacitor 8 tooling
        run: npm install --no-save --package-lock=false --legacy-peer-deps @capacitor/core@8.0.0 @capacitor/cli@8.0.0 @capacitor/android@8.0.0

      - name: Validate Capacitor configuration
        run: node -e "const c=require('./capacitor.config.json'); if(c.appId!=='com.sflow.studyflow'||c.webDir!=='build') process.exit(1);"

      - name: Run unit tests
        run: npm test -- --watchAll=false

      - name: Build web app
        run: npm run build

      - name: Generate Android project and sync web assets
        run: |
          npx cap add android
          npx cap sync android

      - name: Build Android debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Verify APK exists
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: studyflow-android-debug
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

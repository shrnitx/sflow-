<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StudyFlow</title>
<style>
:root{color-scheme:light dark;--line:var(--color-border,#d9dce3);--muted:var(--color-text-secondary,#737987);--surface:var(--color-background-secondary,#f5f6f8);--accent:#4f46e5;--good:#10b981}
*{box-sizing:border-box}body{margin:0;padding:16px;font:14px/1.45 system-ui,-apple-system,sans-serif;color:var(--color-text-primary,inherit);background:var(--color-background-primary,transparent)}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}h1{font-size:19px;margin:0;font-weight:750;letter-spacing:-.03em}.sub{color:var(--muted);font-size:12px;margin-top:2px}.mark{background:#4f46e5;color:white;border-radius:10px;padding:8px 10px;font-weight:800}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:14px}.stat,.panel{border:1px solid var(--line);border-radius:12px;padding:12px}.stat strong{display:block;font-size:22px;letter-spacing:-.04em}.stat span{font-size:12px;color:var(--muted)}
h2{font-size:14px;margin:0 0 10px}.section{margin-top:14px}.task{display:flex;gap:9px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}.task:first-of-type{border-top:0}.task-main{flex:1;min-width:0}.task-title{font-weight:650;overflow-wrap:anywhere}.meta{font-size:12px;color:var(--muted);margin-top:3px}.pill{font-size:10px;border-radius:99px;padding:3px 7px;background:var(--surface);white-space:nowrap}.row{display:flex;align-items:center;gap:8px}.row.space{justify-content:space-between}button,input,select{font:inherit}button{border:1px solid var(--line);border-radius:8px;background:transparent;padding:7px 10px;cursor:pointer}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}button:disabled{opacity:.5;cursor:wait}.icon{padding:4px 7px}.add-form{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}input,select{width:100%;min-width:0;border:1px solid var(--line);border-radius:8px;padding:9px;background:var(--color-background-primary,transparent);color:inherit}.empty,.message{padding:12px;border-radius:9px;background:var(--surface);color:var(--muted);font-size:13px}.message{margin-bottom:10px}.error{color:#dc2626}.footer{color:var(--muted);font-size:11px;margin-top:12px}
</style>
</head>
<body>
<header><div><h1>StudyFlow</h1><div class="sub">Your study workspace, inside ChatGPT</div></div><div class="mark">SF</div></header>
<div id="message" class="message">Connecting to StudyFlow…</div>
<div class="stats"><div class="stat"><strong id="pending-count">—</strong><span>Open tasks</span></div><div class="stat"><strong id="class-count">—</strong><span>Timetable entries</span></div></div>
<section class="panel"><div class="row space"><h2>My tasks</h2><button id="refresh">Refresh</button></div><div id="tasks"><div class="empty">Loading tasks…</div></div>
<form id="add-form" class="add-form"><input id="task-title" maxlength="180" placeholder="Add a study task…" required><button class="primary" id="add-button" type="submit">Add</button></form></section>
<section class="section panel"><div class="row space"><h2>Timetable</h2><button id="show-timetable">Load</button></div><div id="timetable"><div class="empty">Select Load to see your classes.</div></div></section>
<div class="footer">Changes are saved to your signed-in StudyFlow account. Destructive actions require an explicit request.</div>
<script>
const $=id=>document.getElementById(id);
let tasks=[],timetable=[],pending=false;
const pendingIds=new Set();
const escapeHtml=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
function rpcRequest(method,params={}){return new Promise((resolve,reject)=>{const id=Math.random().toString(36).slice(2);let timeout;const handler=event=>{const message=event.data;if(!message||message.jsonrpc!=="2.0"||message.id!==id)return;window.removeEventListener("message",handler);clearTimeout(timeout);if(message.error)reject(new Error(message.error.message||"App bridge request failed"));else resolve(message.result)};window.addEventListener("message",handler);timeout=setTimeout(()=>{window.removeEventListener("message",handler);reject(new Error("The ChatGPT app bridge did not respond. Open this widget inside ChatGPT."))},15000);window.parent.postMessage({jsonrpc:"2.0",id,method,params},"*")})}
function rpcNotify(method,params={}){window.parent.postMessage({jsonrpc:"2.0",method,params},"*")}
async function initBridge(){await rpcRequest("ui/initialize",{appInfo:{name:"studyflow-widget",version:"0.1.0"},appCapabilities:{},protocolVersion:"2026-01-26"});rpcNotify("ui/notifications/initialized",{})}
function updateFromResponse(response){const data=response?.structuredContent;if(data){if(Array.isArray(data.tasks))tasks=data.tasks;if(Array.isArray(data.timetable))timetable=data.timetable}render();const text=(response?.content||[]).filter(x=>x.type==="text").map(x=>x.text).join(" ");if(text)showMessage(text)}
function showMessage(text,error=false){$("message").textContent=text;$("message").classList.toggle("error",error)}
async function callTool(name,args={}){await initPromise;const response=await rpcRequest("tools/call",{name,arguments:args});updateFromResponse(response);if(response?.isError)throw new Error((response?.content||[]).find(x=>x.type==="text")?.text||"The StudyFlow tool returned an error.");return response}
function render(){const open=tasks.filter(t=>!t.completed);$("pending-count").textContent=open.length;$("class-count").textContent=timetable.length;$("tasks").innerHTML=tasks.length?tasks.map(task=>'<div class="task"><div class="task-main"><div class="task-title">'+escapeHtml(task.title)+'</div><div class="meta">'+escapeHtml(task.subject||"Other")+(task.deadline?" · Due "+escapeHtml(task.deadline):"")+' · '+escapeHtml(task.priority||"Medium")+'</div></div><span class="pill">'+(task.completed?"Done":"Open")+'</span>'+(task.completed?'':'<button class="icon" data-complete="'+escapeHtml(task.id)+'" aria-label="Mark complete">✓</button>')+'</div>').join(""):'<div class="empty">No tasks found. Add your first study task below.</div>';if(timetable.length){$("timetable").innerHTML=timetable.map(item=>'<div class="task"><div class="task-main"><div class="task-title">'+escapeHtml(item.subject)+'</div><div class="meta">'+escapeHtml(["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][item.day]||"Class")+' · '+escapeHtml(item.startTime||"")+(item.endTime?"–"+escapeHtml(item.endTime):"")+(item.room?" · "+escapeHtml(item.room):"")+'</div></div></div>').join("")}else if($("timetable").dataset.loaded==="true"){$("timetable").innerHTML='<div class="empty">No timetable entries found.</div>'}}
async function refresh(){if(pending)return;pending=true;$("refresh").disabled=true;showMessage("Loading your StudyFlow data…");try{await callTool("get_studyflow_dashboard",{includeCompleted:false});showMessage("StudyFlow data refreshed.")}catch(error){showMessage(error.message||"Could not load data.",true)}finally{pending=false;$("refresh").disabled=false}}
$("refresh").addEventListener("click",refresh);
$("add-form").addEventListener("submit",async event=>{event.preventDefault();const title=$("task-title").value.trim();if(!title)return;const button=$("add-button");button.disabled=true;try{await callTool("create_study_task",{title,priority:"Medium"});$("task-title").value="";showMessage("Task saved.")}catch(error){showMessage(error.message||"Could not add task.",true)}finally{button.disabled=false}});
$("tasks").addEventListener("click",async event=>{const button=event.target.closest("[data-complete]");if(!button)return;const id=button.dataset.complete;if(pendingIds.has(id))return;pendingIds.add(id);button.disabled=true;try{await callTool("update_study_task",{id,completed:true});showMessage("Task marked complete.")}catch(error){showMessage(error.message||"Could not update task.",true)}finally{pendingIds.delete(id)}});
$("show-timetable").addEventListener("click",async()=>{const button=$("show-timetable");button.disabled=true;try{const response=await callTool("get_study_timetable",{});$("timetable").dataset.loaded="true";updateFromResponse(response);if(!timetable.length)$("timetable").innerHTML='<div class="empty">No timetable entries found.</div>'}catch(error){showMessage(error.message||"Could not load timetable.",true)}finally{button.disabled=false}});
const initPromise=initBridge().catch(error=>{showMessage(error.message,true);throw error});
initPromise.then(refresh).catch(()=>{});
</script>
</body>
</html>
